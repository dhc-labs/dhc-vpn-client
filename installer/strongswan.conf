# dhc-vpn -- strongswan.conf for charon-svc.
#
# Shipped by the MSI installer; replaces the upstream template that the
# build deploys into etc/strongswan.conf. The log path below is the
# standard %ProgramData% location -- if you install on a non-default
# ProgramData drive, edit this file (or override via the SWANCTL_DIR /
# STRONGSWAN_CONF service env vars in HKLM\SYSTEM\CurrentControlSet\
# Services\charon-svc\Environment).

charon {
    load_modular = yes
    user = ''

    plugins {
        include strongswan.d/charon/*.conf
    }

    filelog {
        charon-log {
            path = C:/ProgramData/dhc-vpn/logs/charon.log
            time_format = %b %e %T
            ike_name = yes
            append = yes
            default = 1
            flush_line = yes
        }
    }
}

include strongswan.d/*.conf
