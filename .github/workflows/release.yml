name: release

# Triggers on a pushed tag matching `v*` (e.g. v0.1.0, v0.1.0-rc1).
# Builds ZIP and MSI artifacts and publishes them as a GitHub Release draft.
#
# Artifacts are currently NOT Authenticode-signed. The SignPath OSS
# application was declined for lack of public-visibility signals; until
# we either (a) re-apply once the project has more traction or (b)
# move to Azure Trusted Signing, releases ship unsigned and users see
# a Windows SmartScreen warning on first run. See README.md
# (`Hinweis zur Code-Signatur`) and docs/USER_GUIDE.md for end-user
# instructions on verifying the SHA256 sidecar files.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write       # required for softprops/action-gh-release

defaults:
  run:
    shell: msys2 {0}

jobs:
  build-and-release:
    name: build + release (unsigned)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-gmp
            autoconf
            automake
            libtool
            bison
            flex
            gperf
            gettext-devel
            unzip

      - name: Cache third_party
        uses: actions/cache@v4
        with:
          path: third_party
          key: third_party-${{ runner.os }}-${{ hashFiles('scripts/fetch-deps.sh') }}

      - name: Fetch external dependencies
        run: ./scripts/fetch-deps.sh

      - name: Build charon-svc
        run: ./scripts/build-charon.sh

      - name: CMake configure
        run: cmake -S . -B build -G "MinGW Makefiles"

      - name: CMake build
        run: cmake --build build --parallel

      - name: Resolve release version
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          $version = $tag -replace '^v',''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package ZIP
        shell: pwsh
        run: ./scripts/package.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: Build MSI
        shell: pwsh
        run: ./scripts/build-msi.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            build/dhc-vpn-${{ steps.ver.outputs.version }}.zip
            build/dhc-vpn-${{ steps.ver.outputs.version }}.zip.sha256
            build/dhc-vpn-${{ steps.ver.outputs.version }}.msi
            build/dhc-vpn-${{ steps.ver.outputs.version }}.msi.sha256
