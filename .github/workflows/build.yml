name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: msys2 {0}

jobs:
  build:
    name: build (windows-2022, MINGW64)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-gmp
            autoconf
            automake
            libtool
            bison
            flex
            gperf
            gettext-devel
            unzip

      - name: Cache third_party (strongSwan source + Wintun + WinDivert)
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: third_party
          key: third_party-${{ runner.os }}-${{ hashFiles('scripts/fetch-deps.sh') }}

      - name: Fetch external dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: ./scripts/fetch-deps.sh

      - name: Build charon-svc
        run: ./scripts/build-charon.sh

      - name: CMake configure (GUI + spike tools)
        run: cmake -S . -B build -G "MinGW Makefiles"

      - name: CMake build
        run: cmake --build build --parallel

      - name: Package distributable ZIP
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Build MSI installer
        shell: pwsh
        run: ./scripts/build-msi.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhc-vpn-build-${{ github.sha }}
          path: |
            build/dhc-vpn-*.zip
            build/dhc-vpn-*.zip.sha256
            build/dhc-vpn-*.msi
            build/dhc-vpn-*.msi.sha256
          if-no-files-found: error
          retention-days: 14
